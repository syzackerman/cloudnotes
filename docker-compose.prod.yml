services:
  app:
    image: ${ECR_IMAGE_URI:?Set ECR_IMAGE_URI to the immutable CloudNotes image URI}
    container_name: cloudnotes-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-600000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1800000}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-10MB}
      DOWNLOAD_URL_EXPIRATION: ${DOWNLOAD_URL_EXPIRATION:-PT5M}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MANAGEMENT_PROMETHEUS_ENABLED: ${MANAGEMENT_PROMETHEUS_ENABLED:-false}
      MANAGEMENT_ENDPOINTS: ${MANAGEMENT_ENDPOINTS:-health}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_CAPACITY: ${RATE_LIMIT_LOGIN_CAPACITY:-10}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-PT1M}
      RATE_LIMIT_REGISTRATION_CAPACITY: ${RATE_LIMIT_REGISTRATION_CAPACITY:-5}
      RATE_LIMIT_REGISTRATION_WINDOW: ${RATE_LIMIT_REGISTRATION_WINDOW:-PT1H}
      RATE_LIMIT_UPLOAD_CAPACITY: ${RATE_LIMIT_UPLOAD_CAPACITY:-30}
      RATE_LIMIT_UPLOAD_WINDOW: ${RATE_LIMIT_UPLOAD_WINDOW:-PT1H}
      RATE_LIMIT_DOWNLOAD_URL_CAPACITY: ${RATE_LIMIT_DOWNLOAD_URL_CAPACITY:-60}
      RATE_LIMIT_DOWNLOAD_URL_WINDOW: ${RATE_LIMIT_DOWNLOAD_URL_WINDOW:-PT1M}
      PAGE_DEFAULT_SIZE: ${PAGE_DEFAULT_SIZE:-20}
      PAGE_MAX_SIZE: ${PAGE_MAX_SIZE:-100}
      PAGE_ALLOWED_SORT_FIELDS: ${PAGE_ALLOWED_SORT_FIELDS:-createdAt,updatedAt,title}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - cloudnotes-internal

  nginx:
    image: nginx:1.27-alpine
    container_name: cloudnotes-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    networks:
      - cloudnotes-internal

networks:
  cloudnotes-internal:
    driver: bridge
