name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/cloudnotes' }}
      APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify application
        run: ./mvnw -B verify
        
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Docker image
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Upload deployment bundle
        run: |
          set -euo pipefail
          tar -czf cloudnotes-deploy-bundle.tgz docker-compose.prod.yml deploy scripts
          aws s3 cp cloudnotes-deploy-bundle.tgz "s3://${AWS_S3_BUCKET}/deployments/${GITHUB_SHA}/cloudnotes-deploy-bundle.tgz"

      - name: Deploy on EC2 through SSM Run Command
        id: ssm
        run: |
          set -euo pipefail

          IMAGE_URI="${{ steps.image.outputs.image_uri }}"
          BUNDLE_URI="s3://${AWS_S3_BUCKET}/deployments/${GITHUB_SHA}/cloudnotes-deploy-bundle.tgz"

          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p '${DEPLOY_APP_DIR}'",
              "cd '${DEPLOY_APP_DIR}'",
              "aws s3 cp '${BUNDLE_URI}' /tmp/cloudnotes-deploy-bundle.tgz",
              "tar -xzf /tmp/cloudnotes-deploy-bundle.tgz",
              "chmod +x scripts/*.sh",
              "AWS_REGION='${AWS_REGION}' AWS_S3_BUCKET='${AWS_S3_BUCKET}' APP_DIR='${DEPLOY_APP_DIR}' HEALTH_URL='http://localhost/actuator/health' scripts/deploy.sh '${IMAGE_URI}'"
            ]
          }
          EOF

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudNotes ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)"

          echo "SSM command status: $STATUS"

          if [[ "$STATUS" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json
            exit 1
          fi
      - name: Check public health endpoint
        if: env.APP_HEALTH_URL != ''
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent "$APP_HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
