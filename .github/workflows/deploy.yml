name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/opt/cloudnotes' }}
      APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify application
        run: ./mvnw -B verify

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Docker image
        id: image
        run: |
          set -euo pipefail
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 through SSM Run Command
        id: ssm
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"
          COMMAND="cd ${DEPLOY_APP_DIR} && AWS_REGION=${AWS_REGION} APP_DIR=${DEPLOY_APP_DIR} HEALTH_URL=http://localhost/actuator/health scripts/deploy.sh '${IMAGE_URI}'"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudNotes ${GITHUB_SHA}" \
            --parameters commands="$COMMAND" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)"
          echo "SSM command status: $STATUS"
          if [[ "$STATUS" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json
            exit 1
          fi

      - name: Check public health endpoint
        if: env.APP_HEALTH_URL != ''
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent "$APP_HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
