name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-containerize:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret-change-me-32chars-minimum
      JWT_EXPIRATION: PT1H
      DATABASE_USERNAME: cloudnotes
      DATABASE_PASSWORD: cloudnotes
      POSTGRES_DB: cloudnotes
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ""
      SWAGGER_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Java formatting
        run: ./mvnw -B spotless:check

      - name: Verify with tests and coverage
        run: ./mvnw -B verify

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Build executable JAR
        run: ./mvnw -B package -DskipTests

      - name: Build Docker image
        run: docker build -t cloudnotes:ci .

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start Compose stack and check health
        run: |
          docker compose up --build -d postgres app
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs app postgres
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
